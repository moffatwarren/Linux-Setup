# hyprlock -- Catppuccin Mocha
# https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# Widget text is pango markup, so a literal '#' in a colour must be written '##'
# (hyprlang eats a single '#' as a comment). Nerd font glyphs are written as the
# character itself for the same reason -- '&##xf001;' is not worth the ambiguity.
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace

$font = JetBrainsMono Nerd Font

# Catppuccin Mocha
$text       = rgba(cdd6f4ff)
$subtext0   = rgba(a6adc8ff)
$overlay0   = rgba(6c7086ff)
$surface1   = rgba(45475aff)
$base       = rgba(1e1e2eff)
$lavender   = rgba(b4befeff)
$mauve      = rgba(cba6f7ff)
$red        = rgba(f38ba8ff)

general {
    hide_cursor = false
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /home/warren/Pictures/wallpapers/emergence.jpg
    blur_passes = 4
    blur_size = 12
    brightness = 0.7
    contrast = 0.9
    vibrancy = 0.17
}

# CLOCK -- 4:46PM. %-I drops the leading zero and %p is uppercased, to match the
# reference. letter_spacing is in pango units (1/1024 pt).
label {
    monitor =
    text = cmd[update:1000] echo "<span letter_spacing='9000'>$(date '+%-I:%M%p')</span>"
    color = $lavender
    font_size = 100
    font_family = $font

    position = 0, 150
    halign = center
    valign = center
}

# GREETING
label {
    monitor =
    text = cmd[update:0] echo "Hi there, $(whoami)"
    color = $subtext0
    font_size = 20
    font_family = $font

    position = 0, -20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 36
    rounding = 18
    outline_thickness = 0

    inner_color = rgba(1e1e2ecc)
    outer_color = $surface1
    check_color = $mauve
    fail_color = $red
    font_color = $text

    placeholder_text = <span foreground="##a6adc8">Input Password...</span>
    fail_text = <span foreground="##f38ba8">$FAIL</span>

    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false

    font_family = $font

    position = 0, -85
    halign = center
    valign = center
}
