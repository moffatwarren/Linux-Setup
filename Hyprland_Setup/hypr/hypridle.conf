# Idle handling. `hypridle` is started by hypr/modules/autostart.lua.
#
# lock_cmd is what loginctl's lock-session signal runs, so every path below
# funnels through it rather than each calling hyprlock itself. The `pidof`
# guard is what stops a second hyprlock stacking on top of the first.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session

    # NO after_sleep_cmd, AND NO DPMS ANYWHERE IN THIS FILE. Deliberate.
    #
    # This file used to carry three `hyprctl dispatch dpms on/off` lines. Under
    # a Lua config that is a syntax error (`hl.dispatch(dpms on)`), so all three
    # were dead and this session had never once driven DPMS. 4fa4ae2 rewrote
    # them into the correct Lua-expression form and they went live -- and BOTH
    # of the paths that then started running left a machine with a black screen
    # and no way back short of a hard reset:
    #
    #   * after_sleep_cmd = dpms on   -- resume from SUPER+SHIFT+L or a lid
    #     close came back with the panel dead. On the laptop AND on the desktop,
    #     which is what rules out monitor_utils.lua: internal_panel() finds no
    #     eDP/LVDS/DSI connector on a desktop and every entry point there
    #     returns early. This file is the only thing the two machines share that
    #     changed.
    #   * the 360 s blank              -- the screen went dark on idle exactly
    #     as intended and then would not come back for any input. Hard reset.
    #
    # The mechanism is not pinned down (Hyprland 0.56.2 + aquamarine; the
    # expression itself is valid -- `hl.dsp.dpms({ state = "on" })` returns a
    # real HL.Dispatcher, verified), but the blast radius is: an unrecoverable
    # display. That is not a state to leave a machine able to reach in exchange
    # for a backlight saving. The lines were inert for this config's whole
    # history and nothing missed them.
    #
    # If DPMS is ever wanted back, it has to be proven recoverable FIRST, and
    # only ever tested behind a detached timer that re-enables it
    # unconditionally a few seconds later -- otherwise the test itself is the
    # outage. Do not simply re-add these lines.
}

# Lock after 5 minutes. hyprlock's own background is what the screen shows from
# here on; the panel stays powered, which is the whole point -- see above.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

