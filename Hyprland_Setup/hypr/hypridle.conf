# Idle handling. `hypridle` is started by hypr/modules/autostart.lua.
#
# lock_cmd is what loginctl's lock-session signal runs, so every path below
# funnels through it rather than each calling hyprlock itself. The `pidof`
# guard is what stops a second hyprlock stacking on top of the first.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # DPMS state does not reliably survive a suspend/resume cycle, so the
    # screen can come back from a lid-close still blanked -- which reads as a
    # dead machine. Turn it back on explicitly.
    #
    # `hyprctl dispatch` takes a Lua EXPRESSION, not a dispatcher name, because
    # the config is Lua: `hyprctl dispatch dpms on` is compiled as
    # `hl.dispatch(dpms on)` and dies with a syntax error. Every dpms line here
    # was in that form and so had never once run -- verified against 0.56.2.
    # PowerMenu.qml's `hl.dsp.exit()` is the same rule.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ state = "on" })'
}

# Lock after 5 minutes.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Blank the panel a minute after that. Separate from the lock so the screen is
# already showing hyprlock (not the desktop) by the time it goes dark, and so
# the backlight is not left burning all night behind a lock screen.
listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ state = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ state = "on" })'
}

