[General]
# Catppuccin Mocha, tuned to match hypr/hyprlock.conf so the login and the lock
# screen read as the same surface: same font, same capsule, no border.
#
# There is no backgroundImage: sddm's greeter runs as the `sddm` user, before
# any session exists, so it cannot read a wallpaper out of /home/warren. A flat
# base is the honest option -- pointing it at ~/Pictures just yields a black
# screen. (A wallpaper would have to be copied somewhere world-readable, e.g.
# /usr/share/backgrounds, and referenced from there.)

# Background color
background=#1e1e2e
# Background image (leave empty to use background color)
backgroundImage=

# Text color
textColor=#cdd6f4
# Font family
fontFamily=JetBrainsMono Nerd Font

# Password field -- borderless capsule, as in hyprlock. Because the greeter has
# no wallpaper to sit on, the fill is surface0 rather than hyprlock's base: base
# here is the background colour, and the field would be invisible.
passwordFieldWidth=260
passwordFieldHeight=36
passwordFieldMargin=20
passwordFieldFontSize=15
passwordFieldLetterSpacing=1
passwordFieldBackground=#313244
passwordFieldBorder=#45475a
passwordFieldBorderActive=#cba6f7
passwordFieldBorderWidth=0
passwordFieldBorderWidthActive=0
passwordFieldRadius=18
# The focus halo was a hardcoded off-palette grey; "none" removes it.
passwordFieldGlow=none
passwordPlaceholder=Input Password...
passwordPlaceholderColor=#a6adc8
# Empty for default circle ●
passwordCharacter=
showPasswordButton=false

# UI Offset -- mirrors hyprlock: clock 150px above centre, field 85px below.
passwordFieldOffsetX=0
passwordFieldOffsetY=85

# Selectors
selectorSpacing=10
selectorFontSize=14
selectorArrowFontSize=17
selectorHeight=35
selectorArrowWidth=30
selectorRadius=10

# The username above the field stands in for hyprlock's "Hi there, warren".
showSelectorPreview=true
selectorPreviewFontSize=18
selectorPreviewColor=#a6adc8
selectorPreviewMargin=25

# Animation duration (milliseconds)
animationDuration=200
# you probably wont see it if its below 1000
fadeInDuration=1000

# Spacing
elementSpacing=15

# Global opacity for all elements
elementOpacity=1.0

# Cursor
showCursor=false

# Help tips. On, because the user and session pickers are hidden until you
# arrow onto them -- there is nothing on screen otherwise to say they exist.
# Set showHelpTips=false to hide the block again.
showHelpTips=true
helpTips=↑ user   ↓ session   ←→ change\nF10 suspend   F11 shutdown   F12 restart
helpTipsFontSize=11
helpTipsColor=#6c7086

# Caps Lock indicator
showCapsLockIndicator=true
capsLockIndicatorColor=#f9e2af
capsLockIndicatorFontSize=12

# Login error -- the only border the field ever draws, so a bad password is
# still visible now that the normal outline is 0.
loginErrorColor=#f38ba8
loginErrorShake=true
loginErrorBorderWidth=2
# Delay in milliseconds before checking if login failed
loginErrorDelay=500

# Password validation
allowEmptyPassword=false
# Clear password field on login error
clearPasswordOnError=true

# Clock -- 4:46PM in lavender, matching hyprlock's letter-spaced clock.
showClock=true
clockOffsetX=0
clockOffsetY=-150
clockFontFamily=JetBrainsMono Nerd Font
clockFontSize=100
clockLetterSpacing=9
clockColor=#b4befe
# Clock format placeholders:
# %h - 12 hour format without leading zero (9)
# %H - 24 hour format with leading zero (09)
# %m - minutes without leading zero (9)
# %M - minutes with leading zero (09)
# %s - seconds without leading zero (3)
# %S - seconds with leading zero (09)
# %P - AM/PM, %p - am/pm
clockFormat=%h:%M%P
