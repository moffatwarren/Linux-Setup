[Settings]
# GTK4 has no theme engine -- libadwaita apps ignore gtk-theme-name and read
# gtk.css instead. Only the icon/cursor/font settings do anything here.
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=Cantarell 11
# No gtk-cursor-theme-name, but NOT because the cursor is missing: this machine
# does have Bibata-Modern-Ice, in ~/.local/share/icons (Xcursor `cursors/` plus
# a hyprcursor `manifest.hl`), and both XCURSOR_THEME and HYPRCURSOR_THEME
# resolve against it. `/usr/share/icons` holds only Adwaita, so checking there
# alone makes it look uninstalled -- it is a per-user theme.
#
# It is left unnamed because nothing in this repo puts it on a machine: no
# package owns it (`pacman -Qo` finds none) and it is in neither PACMAN_PKGS nor
# PARU_PKGS, so a fresh deploy would name a theme that is not there yet and GTK
# would fall back to Adwaita without saying so. Naming a theme the repo cannot
# guarantee is worse than naming none -- it reads as a working setting.
#
# The cursor actually comes from XCURSOR_THEME/HYPRCURSOR_THEME in
# ~/.config/uwsm/env, which is not in CONFIGS either, so it is unmanaged too.
# Add the theme to PARU_PKGS before naming it in either place.
gtk-cursor-theme-size=24
gtk-application-prefer-dark-theme=1
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
