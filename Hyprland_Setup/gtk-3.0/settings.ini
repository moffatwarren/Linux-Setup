[Settings]
# The theme is stock adw-gtk3-dark; gtk.css recolours it to Catppuccin Mocha.
# Naming adw-gtk3-dark rather than adw-gtk3 + prefer-dark matters for GTK3:
# gtk-application-prefer-dark-theme only picks the dark variant of a theme that
# ships one in a single directory, and adw-gtk3 ships light and dark as two.
gtk-theme-name=adw-gtk3-dark
gtk-application-prefer-dark-theme=1
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=Cantarell 11
# No gtk-cursor-theme-name: the previous config named Bibata-Modern-Ice,
# which is not installed on this machine or in PACMAN_PKGS/PARU_PKGS, so
# GTK silently fell back to Adwaita anyway. Naming a theme that is not
# there is worse than naming none -- it reads as a working setting.
gtk-cursor-theme-size=24
gtk-toolbar-style=GTK_TOOLBAR_ICONS
gtk-toolbar-icon-size=GTK_ICON_SIZE_LARGE_TOOLBAR
gtk-button-images=0
gtk-menu-images=0
gtk-enable-event-sounds=1
gtk-enable-input-feedback-sounds=0
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
