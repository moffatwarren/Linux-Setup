# One sink for the GPU's HDMI/DP audio, not one per connector.
#
# The HDMI audio codec on a GPU exposes a pin per connector the chip COULD
# drive -- four here -- and ALSA ships a UCM profile ("HiFi") that declares a
# PCM for every one of them. WirePlumber then creates a node per PCM, so a
# laptop with a single external monitor gets four identical "HDMI / DisplayPort
# Output" sinks in pavucontrol and in the bar's audio menu, three of which lead
# nowhere.
#
# PipeWire already knows which one is real. With one monitor connected,
# `pactl list cards` reports:
#
#   [Out] HDMI1: ... availability group: HDMI/DP,pcm=3, available
#   [Out] HDMI2: ... availability group: HDMI/DP,pcm=7, not available
#   [Out] HDMI3: ... availability group: HDMI/DP,pcm=8, not available
#   [Out] HDMI4: ... availability group: HDMI/DP,pcm=9, not available
#
# and the kernel agrees -- /proc/asound/card0/eld#0.0 has `monitor_present 1`
# and names the display, while eld#0.1 through 0.3 have `monitor_present 0`.
# The UCM profile is what ignores all of that: its PCMs are static.
#
# Turning UCM off for this card hands it back to ACP, the classic profile set,
# which exposes ONE sink and switches its active port -- driven by exactly the
# availability above. This is not a filter or a workaround in the bar: nothing
# downstream has to deduplicate, and pavucontrol is clean too, because the
# extra sinks are never created.
#
# MATCHED BY MIXER NAME, deliberately, not by card name or PCI path. The two
# cards here are both called "HD-Audio Generic" and `device.name` carries the
# PCI slot (`alsa_card.pci-0000_07_00.1`), which is true of one machine only --
# the kind of value this repo does not commit. `alsa.mixer_name` is the codec:
# "ATI R6xx HDMI" here, "Realtek ALC257" for the built-in analog card, and the
# Intel and NVIDIA HDMI codecs carry "HDMI" in the same field. So the pattern
# picks out GPU HDMI audio on any of them and cannot reach an analog card. On a
# machine with no such codec the rule matches nothing and does nothing.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.product.name = "~.*HDMI.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.use-ucm = false
      }
    }
  }
]
